<!-- 508 Media Co. | Hunter Quinn South Park delivery page. Page Header Code Injection for /hq-southpark only.
     The site-wide footer injection draws the homepage (#mc508) on every page; this hides it here and mounts the delivery page instead. -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
#hq508{
  --ink:#06070A; --panel:#0E1219; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
  --fg:#F5F7FA; --fg2:#A3ABB7; --fg3:#6B7480; --blue:#488FF6; --blue-wash:rgba(72,143,246,.09);
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
#hq508, #hq508 *{box-sizing:border-box}
#hq508{margin:0;background:var(--ink);background-image:radial-gradient(110% 60% at 50% 0%,#141922 0%,var(--ink) 70%);
  color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
#hq508 .wrap{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:flex;flex-direction:column;gap:56px}
#hq508 .kick{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);font-weight:500;margin:0}
#hq508 .muted{color:var(--fg2)}
#hq508 h1, #hq508 h2{font-family:var(--display);text-transform:uppercase;margin:0;text-wrap:balance;letter-spacing:.005em}
#hq508 h1{font-size:clamp(40px,8vw,68px);line-height:.95;font-weight:700}
#hq508 h1 em, #hq508 h2 em{font-style:normal;color:var(--blue)}
#hq508 h2{font-size:clamp(28px,5vw,40px);line-height:1;font-weight:700}
#hq508 p{margin:0}
#hq508 .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
#hq508 .mark{display:inline-flex;align-items:center;gap:8px;position:relative;padding:7px 13px}
#hq508 .mark::before, #hq508 .mark::after{content:"";position:absolute;width:10px;height:10px;border:1.8px solid var(--blue)}
#hq508 .mark::before{top:0;left:0;border-right:0;border-bottom:0}
#hq508 .mark::after{bottom:0;right:0;border-left:0;border-top:0}
#hq508 .mark b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
#hq508 .mark s{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;text-decoration:none;color:transparent;-webkit-text-stroke:1px var(--fg)}
#hq508 .mark i{width:5px;height:5px;border-radius:50%;background:var(--blue);align-self:flex-end;margin-bottom:5px}
#hq508 .slate{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);display:flex;gap:14px;flex-wrap:wrap}
#hq508 .slate span:not(:last-child)::after{content:"/";margin-left:14px;color:var(--line2)}
#hq508 .intro{display:flex;flex-direction:column;gap:18px}
#hq508 .note{max-width:62ch;font-size:17px;color:#C9CFD8}
#hq508 .note b{color:var(--fg);font-weight:600}
#hq508 .reel{display:flex;flex-direction:column;gap:16px}
#hq508 .reelhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
#hq508 .reelhead > div:first-child{display:flex;flex-direction:column;gap:8px;min-width:0}
#hq508 .seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
#hq508 .seg button{all:unset;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);
  padding:8px 14px;border-radius:999px;transition:background .2s,color .2s}
#hq508 .seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
#hq508 .seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#hq508 .screen{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;justify-content:center}
#hq508 .screen video{display:block;width:100%;max-width:100%;background:#000}
#hq508 .screen.phone video{width:auto;height:min(72vh,680px);max-width:100%}
#hq508 .specs{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
#hq508 .specs b{color:var(--fg2);font-weight:500}
#hq508 .btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--body);font-weight:600;font-size:15px;text-decoration:none;
  color:#fff;background:var(--blue);border:0;border-radius:8px;padding:13px 20px;cursor:pointer}
#hq508 .btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line2)}
#hq508 .btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#hq508 .btn svg{flex:0 0 auto}
#hq508 .dl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
#hq508 .dl .muted{font-size:14px}
#hq508 .uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#hq508 .uses div{background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
#hq508 .uses b{font-size:15px;font-weight:600}
#hq508 .uses p{font-size:14px;color:var(--fg2);line-height:1.5}
#hq508 .uses .fmt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
#hq508 .bonus{border:1.5px solid var(--blue);border-radius:14px;background:var(--blue-wash);padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:18px}
#hq508 .ask{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--panel);
  border:1px solid var(--line2);border-radius:14px;padding:clamp(18px,4vw,28px)}
#hq508 .ask .stars{display:flex;gap:3px;color:var(--blue)}
#hq508 .askbody{display:flex;flex-direction:column;gap:6px;min-width:0}
#hq508 .askbody p{color:#C9CFD8;max-width:52ch}
@media (max-width:720px){#hq508 .ask{grid-template-columns:1fr}}
#hq508 .close{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;border-top:1px solid var(--line);padding-top:32px}
#hq508 .close > div{display:flex;flex-direction:column;gap:12px;min-width:0}
#hq508 .contact{display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:14px}
#hq508 .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#hq508 .copy{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);
  border:1px solid var(--line2);border-radius:5px;padding:4px 8px}
#hq508 .copy:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#hq508 .contact a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line2)}
#hq508 .sig{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.01em}
@media (max-width:640px){#hq508 .close{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){#hq508, #hq508 *{transition:none!important}}

#hq508{border-radius:16px;overflow:hidden;text-align:left}
#hq508 a{text-decoration:none}

</style>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var t = document.getElementById('hq508tpl');
  if (!t || document.getElementById('hq508')) return;
  document.body.appendChild(t.content.cloneNode(true));

// Full-quality files: WeTransfer link made Oct 6, 2026 with a 30-day expiry (dies ~Nov 5). Swap and republish if it lapses.
const DRIVE_URL = "https://we.tl/t-Fju2e5WGPwsNxqKx";

const SPECS = {
  sp: { wide: ['0:36','1920 × 1080','website · YouTube · Facebook'],
        phone:['0:36','1080 × 1920','Reels · TikTok · Stories'] }
};

document.querySelectorAll('.seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.target, v = document.getElementById(id);
    btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    v.pause(); v.poster = btn.dataset.poster; v.src = btn.dataset.src; v.load();
    document.getElementById(id + '-screen').classList.toggle('phone', btn.dataset.fmt === 'phone');
    const s = SPECS[id] && SPECS[id][btn.dataset.fmt];
    if (s) document.getElementById(id + '-specs').innerHTML =
      `<span><b>Length</b> ${s[0]}</span><span><b>Size</b> ${s[1]}</span><span><b>Use</b> ${s[2]}</span>`;
  });
});

const dl = document.getElementById('dl-row');
if (DRIVE_URL) {
  dl.innerHTML = `<a class="btn" href="${DRIVE_URL}" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>
    Download full-quality files</a><span class="muted">Both versions, 1080p. The download link works until Nov 5.</span>`;
} else {
  dl.innerHTML = `<span class="muted">You're watching a web-size copy. I'll text you a link to the full-quality 1080p files.</span>`;
}

document.querySelectorAll('.copy').forEach(b => b.addEventListener('click', () => {
  const t = document.getElementById(b.dataset.copy).textContent;
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1600); };
  try {
    navigator.clipboard.writeText(t).then(done, () => selectText(b.dataset.copy));
  } catch (e) { selectText(b.dataset.copy); }
}));
function selectText(id){ const r = document.createRange(); r.selectNodeContents(document.getElementById(id));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

});
</script>

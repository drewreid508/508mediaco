#plan508, #plan508 *{box-sizing:border-box}
#plan508 h1,#plan508 p{margin:0;padding:0}
#plan508 h1{color:var(--fg)!important;font-family:var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;

#plan508 .kick{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);font-weight:500}

/* header */
#plan508 .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
#plan508 .mark{display:inline-flex;align-items:center;gap:8px;position:relative;padding:7px 13px}
#plan508 .mark::before,#plan508 .mark::after{content:"";position:absolute;width:10px;height:10px;border:1.8px solid var(--blue)}
#plan508 .mark::before{top:0;left:0;border-right:0;border-bottom:0}
#plan508 .mark::after{bottom:0;right:0;border-left:0;border-top:0}
#plan508 .mark b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--fg)}
#plan508 .mark s{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;text-decoration:none;color:transparent;-webkit-text-stroke:1px var(--fg)}
#plan508 .mark i{width:5px;height:5px;border-radius:50%;background:var(--blue);align-self:flex-end;margin-bottom:5px}
#plan508 .slate{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);display:flex;gap:14px;flex-wrap:wrap}
#plan508 .slate span:not(:last-child)::after{content:"/";margin-left:14px;color:var(--line2)}

/* intro */
#plan508 .intro{display:flex;flex-direction:column;gap:18px}
#plan508 .note{font-size:clamp(16px,2.4vw,19px);color:#C9CFD8;max-width:56ch}
#plan508 .facts{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#plan508 .facts li{background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
#plan508 .facts b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;color:var(--fg)}
#plan508 .facts span{font-size:13.5px;color:var(--fg2);line-height:1.4}
@media (max-width:560px){#plan508 .facts{grid-template-columns:1fr} #plan508 .facts li{flex-direction:row;align-items:baseline;gap:12px} #plan508 .facts b{min-width:70px}}

/* form */
#plan508 .sheet{background:#F1EEF8;border-radius:14px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.5);scroll-margin-top:16px}
#plan508 .sheet iframe{display:block;width:100%;height:2300px;border:0;background:#F1EEF8}
@media (max-width:640px){#plan508 .sheet iframe{height:3400px}}
#plan508 .alt{font-size:14px;color:var(--fg2)}
#plan508 .alt a{color:var(--blue-lift);border-bottom:1px solid currentColor}

/* closing */
#plan508 .close{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;border-top:1px solid var(--line);padding-top:32px}
#plan508 .close > div{display:flex;flex-direction:column;gap:12px;min-width:0}
#plan508 .contact{display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:14px}
#plan508 .contact a{color:var(--fg);border-bottom:1px solid var(--line2);align-self:flex-start}
#plan508 .sig{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.01em;color:var(--fg)}
@media (max-width:640px){#plan508 .close{grid-template-columns:1fr}}

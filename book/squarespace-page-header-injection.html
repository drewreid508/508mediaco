<script>
document.addEventListener('DOMContentLoaded', function(){
  var t = document.getElementById('bk508tpl');
  if (!t || document.getElementById('bk508')) return;
  document.body.appendChild(t.content.cloneNode(true));
  (function(){
  document.title = "Book Your Shoot | 508 Media Co.";
  var ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLScPJgBOJWIbSs4m3CU1ZJlzait9Lq0HhUQ8gnw0waeYPXLL_w/formResponse';
  var DRAFT = '508-book-draft-v1';
  // [entry id, type, label, required, options|hint, extra]
  // types: text email tel url area radio check (pills) ; 'other' flag adds an Other chip with a text box (Google's __other_option__)
  var SECTIONS = [
    { t:'About you', q:[
      ['1780421901','text','Your name',1,null,{ac:'name'}],
      ['997157979','tel','Phone number',1,null,{ac:'tel',hint:"I'll text you here to confirm."}],
      ['1141518647','text','Instagram / TikTok handle',0,null,{ph:'@yourhandle',hint:'So I can tag you when it posts.'}]
    ]},
    { t:'The shoot', q:[
      ['583848107','radio','What are we shooting?',1,['Motocross / dirt bike','Car','Truck / lifted truck','Motorcycle / street bike','ATV / UTV / side-by-side','Boat / jet ski','Car meet / car show','Drag / drift / track day','Off-road / mudding / trail ride','Car or bike build (before & after)','New car / truck reveal','Event / birthday / party'],{w2:1,other:1}],
      ['1758462116','radio','What style of video?',1,['Hype edit (fast cuts to the beat)','Cinematic (smooth, slow-mo, movie feel)','Day recap (the whole day, start to finish)','Walkaround / showcase (show off the ride)','Not sure, you pick'],{w2:1,other:1}],
      ['1378088785','url','Example video you like',0,null,{w2:1,ph:'Paste a link to any video with the vibe you want'}],
      ['1514331381','text','Shoot date',1,null,{ph:'Sat Oct 25'}],
      ['2038017969','text','Time',1,null,{ph:'10am, or "my motos are at 11 and 2"'}],
      ['1581876838','area','Location',1,null,{w2:1,ph:'Track name, address, or drop a Google Maps link'}]
    ]},
    { t:'The edit', q:[
      ['2135875188','text','Song',0,null,{w2:1,ph:"A song you want, or leave blank and I'll pick"}],
      ['1040191428','radio','Format',1,['Vertical (IG / TikTok)','Wide 16:9 (YouTube)','Both'],{w2:1}],
      ['1947798285','area','Any shots you really want?',0,null,{w2:1,ph:'A big jump, a burnout, a flyby, a certain spot, you with your friends'}],
      ['1936805900','check','Deposit',1,['I understand a deposit locks in my date'],{w2:1,tall:1}]
    ]}
  ];

  var form = document.getElementById('bk-form');
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  var html = '';
  SECTIONS.forEach(function(s, si){
    html += '<section class="card" data-sec="' + si + '"' + (s.branch ? ' hidden' : '') + '>' +
      '<div class="w2"><div class="head"><span class="n">0' + (si + 1) + '</span><h2>' + esc(s.t) + '</h2></div>' +
      (s.sub ? '<p class="hint" style="margin:10px 0 0">' + esc(s.sub) + '</p>' : '') + '</div>';
    s.q.forEach(function(q){
      var id = q[0], ty = q[1], lab = q[2], req = q[3], opts = q[4], x = q[5] || {};
      var name = 'entry.' + id, star = req ? '<span class="req" aria-hidden="true">*</span>' : '';
      var cls = 'q' + (x.w2 || ty === 'area' ? ' w2' : '');
      if (ty === 'radio' || ty === 'check') {
        var it = ty === 'radio' ? 'radio' : 'checkbox';
        html += '<div class="' + cls + '" role="group" aria-labelledby="l' + id + '" data-q="' + id + '"' + (req ? ' data-req="1"' : '') + '>' +
          '<p class="lbl" id="l' + id + '">' + esc(lab) + star + (x.pick ? ' <em>(pick any)</em>' : '') + '</p>' +
          (x.hint ? '<span class="hint">' + esc(x.hint) + '</span>' : '') +
          '<div class="chk' + (x.tall ? ' tall' : '') + '">';
        opts.forEach(function(o){ html += '<label><input type="' + it + '" name="' + name + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>'; });
        if (x.other) html += '<label><input type="' + it + '" name="' + name + '" value="__other_option__" data-other="' + id + '"><span>Other</span></label>';
        html += '</div>';
        if (x.other) html += '<div class="other" id="o' + id + '" hidden><input type="text" name="' + name + '.other_option_response" aria-label="' + esc(lab) + ': other" placeholder="Tell me more"></div>';
        html += '<p class="err">' + (ty === 'check' && opts.length === 1 ? 'Please check the box to continue.' : 'Pick at least one.') + '</p></div>';
      } else {
        var tag = ty === 'area' ? 'textarea' : 'input';
        var attrs = ' id="f' + id + '" name="' + name + '"' + (x.ph ? ' placeholder="' + esc(x.ph) + '"' : '') + (x.ac ? ' autocomplete="' + x.ac + '"' : '') + (req ? ' required' : '');
        var typeAttr = tag === 'input' ? ' type="' + (ty === 'url' ? 'text' : ty) + '"' + (ty === 'tel' ? ' inputmode="tel"' : ty === 'url' ? ' inputmode="url" autocapitalize="off"' : '') : '';
        html += '<div class="' + cls + '" data-q="' + id + '"' + (req ? ' data-req="1"' : '') + '><label for="f' + id + '">' + esc(lab) + star + '</label>' + (x.hint ? '<span class="hint">' + esc(x.hint) + '</span>' : '') +
          (tag === 'input' ? '<input' + typeAttr + attrs + '>' : '<textarea' + attrs + '></textarea>') +
          '<p class="err">' + (ty === 'email' ? 'Enter an email like you@business.com.' : 'This one is required.') + '</p></div>';
      }
    });
    html += '</section>';
  });
  html += '<input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">' +
    '<div class="send"><button class="btn" type="submit" id="bk-send">Book my shoot <span aria-hidden="true">→</span></button>' +
    '<p class="formnote">Your date is locked in once the deposit is paid.</p>' +
    '<div class="formmsg" id="bk-msg" role="status" aria-live="polite" hidden></div></div>';
  form.innerHTML = html;

  function sync(){
    form.querySelectorAll('[data-other]').forEach(function(o){
      document.getElementById('o' + o.dataset.other).hidden = !o.checked;
    });
    // progress = answered required questions
    var reqs = [].slice.call(form.querySelectorAll('[data-req]')), done = reqs.filter(answered).length;
    var p = Math.round(100 * done / reqs.length);
    document.getElementById('bk-bar').style.width = p + '%';
    document.getElementById('bk-pct').textContent = p + '%';
  }
  function answered(q){
    if (q.querySelector('.chk')) return !!q.querySelector('.chk input:checked');
    var f = q.querySelector('input,textarea'), v = f.value.trim();
    if (!v) return false;
    if (f.type === 'email') return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    return true;
  }

  // draft (per-viewer convenience only)
  function save(){
    try {
      var d = {};
      new FormData(form).forEach(function(v, k){ (d[k] = d[k] || []).push(v); });
      localStorage.setItem(DRAFT, JSON.stringify(d));
    } catch (e) {}
  }
  try {
    var d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
    if (d) Object.keys(d).forEach(function(k){
      form.querySelectorAll('[name="' + k + '"]').forEach(function(el){
        if (el.type === 'checkbox' || el.type === 'radio') el.checked = d[k].indexOf(el.value) > -1;
        else el.value = d[k][0] || '';
      });
    });
  } catch (e) {}

  form.addEventListener('input', function(e){
    var q = e.target.closest('[data-q]');
    if (q && q.classList.contains('field-bad') && answered(q)) q.classList.remove('field-bad');
    sync(); save();
  });
  form.addEventListener('change', function(){ sync(); save(); });
  sync();

  var msg = document.getElementById('bk-msg');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (form.elements._gotcha.value) return;
    var bad = [];
    form.querySelectorAll('[data-req]').forEach(function(q){
      if (q.closest('[hidden]')) return;
      var ok = answered(q); q.classList.toggle('field-bad', !ok); if (!ok) bad.push(q);
    });
    if (bad.length) {
      msg.hidden = false; msg.className = 'formmsg bad';
      msg.textContent = bad.length === 1 ? 'One required question still needs an answer.' : bad.length + ' required questions still need an answer.';
      bad[0].scrollIntoView({ block: 'center' });
      var f = bad[0].querySelector('input,textarea'); if (f) f.focus({ preventScroll: true });
      return;
    }
    var body = new URLSearchParams();
    new FormData(form).forEach(function(v, k){
      if (k === '_gotcha') return;
      if (/\.other_option_response$/.test(k)) {
        var base = k.replace('.other_option_response', '');
        if (!form.querySelector('[name="' + base + '"][value="__other_option__"]:checked')) return;
      }
      if (String(v).trim() !== '') body.append(k, v);
    });
    body.append('pageHistory', '0');  // the Google Form is one page
    body.append('fvv', '1');
    form.classList.add('sending'); msg.hidden = true;
    fetch(ACTION, { method: 'POST', mode: 'no-cors', body: body }).then(function(){
      try { localStorage.removeItem(DRAFT); } catch (e) {}
      form.hidden = true;
      document.getElementById('bk-prog').style.display = 'none';
      var dn = document.getElementById('bk-done'); dn.hidden = false; dn.focus(); dn.scrollIntoView({ block: 'start' });
    }).catch(function(){
      form.classList.remove('sending');
      msg.hidden = false; msg.className = 'formmsg bad';
      msg.innerHTML = "That didn't send. Check your connection and try again, or text me at <a href=\"sms:+18649154071\">(864) 915-4071</a>.";
    });
  });
})();
});
</script>
